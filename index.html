<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нэр цуглуулах хуудас</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 80px;
            background-color: #f4f7f6;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        input {
            padding: 12px;
            font-size: 16px;
            width: 250px;
            margin-right: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1b5e20;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Манай сайтад бүртгүүлэх</h2>
        <p>Доор нэрээ бичиж илгээнэ үү:</p>
        
        <!-- Зөвхөн нэр цуглуулах Formspree форм -->
        <form action="https://formspree.io/f/xaeegqyy" method="POST">
            <input type="text" name="username" placeholder="Таны бүтэн нэр..." required>
            <button type="submit">Илгээх</button>
        </form>
    </div>

</body>
</html>
