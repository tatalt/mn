<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нэвтрэх Хэсэгтэй Сайт</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Нэвтрэх маягт -->
        <div id="login-box" class="card">
            <h3>🔑 Нэвтрэх</h3>
            <form id="login-form">
                <input type="text" id="username" placeholder="Хэрэглэгчийн нэр" required><br><br>
                <input type="password" id="password" placeholder="Нууц үг" required><br><br>
                <button type="submit">Нэвтрэх</button>
            </form>
        </div>

        <!-- Нэвтэрсний дараа харагдах хэсэг -->
        <div id="user-box" class="card" style="display: none;">
            <h3>Сайн байна уу, <span id="display-name"></span>! 👋</h3>
            <p>Та амжилттай нэвтэрлээ.</p>
            <button id="logout-btn">Гарах</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
